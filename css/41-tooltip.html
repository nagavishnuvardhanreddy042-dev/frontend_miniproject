<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltip</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #1e3c72;
        }

        .tooltip {
            position: relative;
            display: inline-block;
            margin-top: 80px;
            background-color: #1e3c72;
            color: white;
            padding: 15px 25px;
            border-radius: 6px;
            cursor: pointer;
        }

        .tooltip-text {
            visibility: hidden;
            width: 200px;
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 6px;

            position: absolute;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%);
        }

        .tooltip:hover .tooltip-text {
            visibility: visible;
        }
    </style>
</head>
<body>

    <h1>CSS Tooltip</h1>

    <div class="tooltip">
        Hover Over Me

        <span class="tooltip-text">
            This is a helpful tooltip message.
        </span>
    </div>

</body>
</html>
