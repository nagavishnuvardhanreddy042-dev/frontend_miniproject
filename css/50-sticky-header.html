<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Header</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            line-height: 1.8;
        }

        header {
            position: sticky;
            top: 0;
            background: #1e3c72;
            color: white;
            padding: 20px;
            text-align: center;
            z-index: 1000;
        }

        nav {
            background: #2a5298;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        .content {
            padding: 30px;
        }

        .section {
            height: 500px;
            padding: 30px;
            margin-bottom: 20px;
            background: #eef2f3;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sticky Header Example</h1>

        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
        </nav>
    </header>

    <div class="content">

        <section class="section" id="home">
            <h2>Home Section</h2>
            <p>
                Scroll down to see that the header remains at the top.
            </p>
        </section>

        <section class="section" id="about">
            <h2>About Section</h2>
            <p>
                This section demonstrates sticky positioning.
            </p>
        </section>

        <section class="section" id="services">
            <h2>Services Section</h2>
            <p>
                The header stays visible while scrolling.
            </p>
        </section>

    </div>

</body>
</html>
