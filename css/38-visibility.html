<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Visibility</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            padding: 30px;
        }

        h1 {
            color: #1e3c72;
            text-align: center;
        }

        .box {
            padding: 25px;
            margin: 20px;
            background-color: #1e3c72;
            color: white;
        }

        .hidden {
            visibility: hidden;
        }

        .visible {
            visibility: visible;
        }
    </style>
</head>
<body>

    <h1>Visibility Property</h1>

    <div class="box visible">
        Visible Box
    </div>

    <div class="box hidden">
        Hidden Box - Space is still reserved
    </div>

    <div class="box visible">
        Another Visible Box
    </div>

</body>
</html>
