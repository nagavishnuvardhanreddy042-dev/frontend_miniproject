<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Classes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #1e3c72;
        }

        a {
            display: inline-block;
            margin: 15px;
            padding: 12px 20px;
            background-color: #1e3c72;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        a:hover {
            background-color: #d45880;
        }

        a:active {
            background-color: green;
        }

        input {
            display: block;
            margin: 20px auto;
            padding: 12px;
            border: 2px solid #aaa;
            border-radius: 6px;
        }

        input:focus {
            border-color: #1e3c72;
            outline: none;
            background-color: #eef5ff;
        }

        li:first-child {
            color: red;
            font-weight: bold;
        }

        li:last-child {
            color: green;
            font-weight: bold;
        }

        li:nth-child(even) {
            background-color: #d9e8ff;
        }

        li {
            padding: 8px;
            margin: 5px;
        }
    </style>
</head>
<body>

    <h1>CSS Pseudo-classes</h1>

    <a href="#">Hover Over Me</a>

    <a href="#">Click Me</a>

    <input type="text" placeholder="Click inside this input">

    <h2>Student List</h2>

    <ul>
        <li>N.vishnu vardhan</li>
        <li>Bhavyan</li>
        <li>Hemanth</li>
        <li>Deepak</li>
        <li>Suhaas</li>
    </ul>

</body>
</html>
