<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonts and Text Properties</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            padding: 30px;
        }

        h1 {
            color: #1e3c72;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .paragraph1 {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .paragraph2 {
            font-style: italic;
            text-decoration: underline;
            text-align: center;
            line-height: 2;
        }

        .paragraph3 {
            text-transform: capitalize;
            word-spacing: 10px;
            letter-spacing: 2px;
        }

        .box {
            background-color: white;
            padding: 20px;
            border: 2px solid #1e3c72;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h1>Fonts and Text Properties</h1>

    <div class="box">
        <p class="paragraph1">
            This paragraph demonstrates font size and font weight.
        </p>

        <p class="paragraph2">
            This paragraph demonstrates italic text, underline and line height.
        </p>

        <p class="paragraph3">
            this paragraph demonstrates text transformation, word spacing and letter spacing.
        </p>
    </div>

</body>
</html>
