<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Navigation Bar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
        }

        h1 {
            text-align: center;
            color: #1e3c72;
            margin: 40px;
        }

        .navbar {
            background-color: #1e3c72;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            margin: 0 5px;
            border-radius: 6px;
        }

        .navbar a:hover {
            background-color: #2a5298;
        }

        .content {
            background-color: white;
            width: 80%;
            margin: 40px auto;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h1>CSS Navigation Bar</h1>

    <nav class="navbar">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>
    </nav>

    <div class="content">
        <h2>Welcome to My Website</h2>
        <p>This page demonstrates a simple horizontal navigation bar.</p>
    </div>

</body>
</html>
