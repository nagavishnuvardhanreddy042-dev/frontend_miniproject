<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Transitions</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f3;
            padding: 40px;
            text-align: center;
        }

        .box {
            width: 200px;
            height: 120px;
            background: #1e3c72;
            color: white;
            margin: 40px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;

            transition:
                width 1s ease,
                height 1s ease,
                background-color 1s ease,
                transform 1s ease;
        }

        .box:hover {
            width: 300px;
            height: 180px;
            background: #2a5298;
            transform: rotate(5deg) scale(1.1);
        }
    </style>
</head>
<body>

    <h1>Advanced Transition Example</h1>

    <div class="box">
        Hover Over Me
    </div>

</body>
</html>
