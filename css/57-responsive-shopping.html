<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Shopping Page</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        header {
            background: #1e3c72;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 30px;
        }

        .product {
            background: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .product .image {
            height: 130px;
            background: #dce8f7;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            font-size: 40px;
        }

        .product h2 {
            color: #1e3c72;
        }

        button {
            background: #1e3c72;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #2a5298;
        }

        @media (max-width: 900px) {
            .products {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .products {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Online Shopping Store</h1>
        <p>Shop your favorite products</p>
    </header>

    <section class="products">

        <div class="product">
            <div class="image">🎧</div>
            <h2>Headphones</h2>
            <p>₹999</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <div class="image">⌚</div>
            <h2>Smart Watch</h2>
            <p>₹1499</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <div class="image">📱</div>
            <h2>Mobile Phone</h2>
            <p>₹15999</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <div class="image">💻</div>
            <h2>Laptop</h2>
            <p>₹49999</p>
            <button>Buy Now</button>
        </div>

    </section>

</body>
</html>
