<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Different CSS Selectors</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            padding: 30px;
        }

        h1,
        h2 {
            color: #1e3c72;
        }

        .box {
            padding: 20px;
            background-color: white;
            margin: 15px 0;
            border-radius: 8px;
        }

        #unique {
            border: 3px solid red;
        }

        input[type="text"] {
            border: 2px solid green;
            padding: 10px;
        }

        p,
        span {
            color: #d45880;
        }
    </style>
</head>
<body>

    <h1>CSS Selector Types</h1>

    <div class="box">
        <h2>Element Selector</h2>
        <p>Styled using the p selector.</p>
    </div>

    <div class="box" id="unique">
        <h2>ID Selector</h2>
        <p>This box uses an ID selector.</p>
    </div>

    <div class="box">
        <h2>Attribute Selector</h2>
        <input type="text" placeholder="Text input">
    </div>

    <span>Grouping selector example</span>

</body>
</html>
