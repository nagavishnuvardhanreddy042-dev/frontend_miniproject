<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opacity and Transparency</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #1e3c72;
        }

        .box {
            width: 250px;
            padding: 40px;
            margin: 20px auto;
            color: white;
            background-color: #1e3c72;
        }

        .full {
            opacity: 1;
        }

        .medium {
            opacity: 0.6;
        }

        .low {
            opacity: 0.25;
        }
    </style>
</head>
<body>

    <h1>Opacity and Transparency</h1>

    <div class="box full">100% Opacity</div>

    <div class="box medium">60% Opacity</div>

    <div class="box low">25% Opacity</div>

</body>
</html>
