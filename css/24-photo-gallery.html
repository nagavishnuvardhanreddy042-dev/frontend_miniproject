<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #1e3c72;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 900px;
            margin: 30px auto;
        }

        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            transition: transform 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        @media (max-width: 700px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <h1>Photo Gallery</h1>

    <div class="gallery">

        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
             alt="Nature">

        <img src="https://images.unsplash.com/photo-1497250681960-ef046c08a56e"
             alt="Plant">

        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb"
             alt="Mountain">

        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
             alt="Lake">

        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e"
             alt="Forest">

        <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e"
             alt="Landscape">

    </div>

</body>
</html>
