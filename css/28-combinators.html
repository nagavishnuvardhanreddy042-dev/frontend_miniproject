<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Combinators</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            padding: 30px;
        }

        h1 {
            color: #1e3c72;
            text-align: center;
        }

        .parent p {
            color: blue;
        }

        .parent > strong {
            color: red;
        }

        h2 + p {
            background-color: #d9e8ff;
            padding: 10px;
        }

        h2 ~ p {
            border-left: 4px solid #d45880;
            padding-left: 10px;
        }

        .parent {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h1>CSS Combinators</h1>

    <div class="parent">

        <strong>Direct child element</strong>

        <h2>Heading</h2>

        <p>Adjacent sibling paragraph.</p>

        <p>General sibling paragraph.</p>

        <div>
            <p>Descendant paragraph.</p>
        </div>

    </div>

</body>
</html>
