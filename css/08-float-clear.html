<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float and Clear</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #1e3c72;
        }

        .image-box {
            width: 180px;
            height: 120px;
            background-color: #b8d0d3;
            float: left;
            margin-right: 20px;
            text-align: center;
            padding-top: 45px;
            box-sizing: border-box;
        }

        .content {
            background-color: white;
            padding: 20px;
            border: 2px solid #1e3c72;
        }

        .clear-box {
            clear: both;
            margin-top: 30px;
            background-color: #d45880;
            color: white;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h1>Float and Clear</h1>

    <div class="content">
        <div class="image-box">
            Floated Box
        </div>

        <p>
            The float property allows an element to move to the left or
            right while other content flows around it. This technique
            was commonly used for image and text layouts.
        </p>

        <p>
            The clear property prevents elements from appearing beside
            floated elements.
        </p>

        <div class="clear-box">
            This box uses clear: both.
        </div>
    </div>

</body>
</html>
