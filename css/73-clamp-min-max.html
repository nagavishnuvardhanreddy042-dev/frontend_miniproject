<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clamp Min Max</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f3;
            padding: 30px;
        }

        h1 {
            font-size: clamp(24px, 5vw, 60px);
            text-align: center;
            color: #1e3c72;
        }

        .container {
            width: min(90%, 900px);
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        .box {
            width: max(250px, 50%);
            min-height: 150px;
            background: #dce8f7;
            padding: 20px;
            box-sizing: border-box;
        }

        p {
            font-size: clamp(16px, 2vw, 24px);
        }
    </style>
</head>
<body>

    <h1>clamp(), min() and max()</h1>

    <div class="container">
        <div class="box">
            <p>
                This box uses min-width logic through max().
            </p>
        </div>
    </div>

</body>
</html>
