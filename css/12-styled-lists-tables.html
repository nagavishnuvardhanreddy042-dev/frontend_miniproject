<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Lists and Tables</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #1e3c72;
        }

        .subjects {
            background-color: white;
            width: 300px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
        }

        ul {
            list-style-type: square;
        }

        ol {
            list-style-type: upper-roman;
        }

        li {
            padding: 8px;
        }

        table {
            width: 80%;
            margin: 30px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th {
            background-color: #1e3c72;
            color: white;
        }

        th,
        td {
            border: 1px solid #777;
            padding: 12px;
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: #eaf2ff;
        }

        tr:hover {
            background-color: #d45880;
            color: white;
        }
    </style>
</head>
<body>

    <h1>Styled Lists and Tables</h1>

    <div class="subjects">
        <h2>Subjects</h2>

        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>

        <h2>Learning Order</h2>

        <ol>
            <li>HTML Basics</li>
            <li>CSS Styling</li>
            <li>JavaScript DOM</li>
        </ol>
    </div>

    <table>
        <tr>
            <th>Student Name</th>
            <th>Department</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td>N.vishnu vardhan</td>
            <td>CSE</td>
            <td>90</td>
        </tr>

        <tr>
            <td>Bhavyan</td>
            <td>ECE</td>
            <td>85</td>
        </tr>

        <tr>
            <td>Hemanth</td>
            <td>IT</td>
            <td>92</td>
        </tr>
    </table>

</body>
</html>
