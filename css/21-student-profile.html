<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #1e3c72;
        }

        .profile-card {
            width: 320px;
            background-color: white;
            margin: 40px auto;
            padding: 25px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .profile-image {
            width: 110px;
            height: 110px;
            background-color: #b8d0d3;
            border-radius: 50%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .profile-card h2 {
            color: #1e3c72;
        }

        .profile-card p {
            color: #555;
        }

        .details {
            text-align: left;
            margin-top: 20px;
        }

        .details p {
            border-bottom: 1px solid #ddd;
            padding: 8px;
        }
    </style>
</head>
<body>

    <h1>Student Profile</h1>

    <div class="profile-card">

        <div class="profile-image"></div>

        <h2>N.vishnu vardhan</h2>

        <p>B.Tech Computer Science Student</p>

        <div class="details">
            <p><strong>College:</strong> Sai University</p>
            <p><strong>Year:</strong> Second Year</p>
            <p><strong>Department:</strong> CSE</p>
            <p><strong>Interest:</strong> Web Development</p>
        </div>

    </div>

</body>
</html>
