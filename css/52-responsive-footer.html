<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Footer</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .content {
            min-height: 70vh;
            padding: 40px;
            text-align: center;
        }

        footer {
            background: #1e3c72;
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-around;
            gap: 20px;
            flex-wrap: wrap;
        }

        .footer-column {
            min-width: 180px;
        }

        .footer-column h3 {
            margin-bottom: 15px;
        }

        .footer-column a {
            display: block;
            color: white;
            text-decoration: none;
            margin: 8px 0;
        }

        .footer-column a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            footer {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>Responsive Footer Example</h1>
        <p>The footer adjusts according to screen size.</p>
    </div>

    <footer>

        <div class="footer-column">
            <h3>About</h3>
            <a href="#">Our Team</a>
            <a href="#">Company</a>
        </div>

        <div class="footer-column">
            <h3>Quick Links</h3>
            <a href="#">Home</a>
            <a href="#">Services</a>
        </div>

        <div class="footer-column">
            <h3>Contact</h3>
            <a href="#">Email</a>
            <a href="#">Phone</a>
        </div>

    </footer>

</body>
</html>
