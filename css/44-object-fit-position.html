<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Fit and Object Position</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #1e3c72;
        }

        .image-box {
            width: 350px;
            height: 220px;
            margin: 30px auto;
            border: 3px solid #1e3c72;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .contain-box img {
            object-fit: contain;
        }
    </style>
</head>
<body>

    <h1>Object Fit and Object Position</h1>

    <div class="image-box">
        <img
            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
            alt="Nature">
    </div>

    <div class="image-box contain-box">
        <img
            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
            alt="Nature">
    </div>

</body>
</html>
