<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Radius Shapes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #1e3c72;
        }

        .shape {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 20px;
            color: white;
            background-color: #1e3c72;
        }

        .square {
            width: 150px;
            height: 150px;
            border-radius: 10px;
        }

        .circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: #d45880;
        }

        .pill {
            width: 220px;
            height: 80px;
            border-radius: 50px;
            background-color: #4c956c;
        }
    </style>
</head>
<body>

    <h1>Border Radius Shapes</h1>

    <div class="shape square">Rounded Square</div>

    <div class="shape circle">Circle</div>

    <div class="shape pill">Pill Shape</div>

</body>
</html>
