<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #1e3c72;
        }

        .box {
            width: 300px;
            background-color: #d9f0ff;

            padding: 30px;
            border: 5px solid #1e3c72;
            margin: 40px auto;

            text-align: center;
        }

        .content {
            background-color: #ffffff;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h1>CSS Box Model</h1>

    <div class="box">
        <div class="content">
            This box demonstrates:

            <br><br>

            Content

            <br>

            Padding

            <br>

            Border

            <br>

            Margin
        </div>
    </div>

</body>
</html>
