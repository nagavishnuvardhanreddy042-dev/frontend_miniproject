<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Z-Index</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #1e3c72;
        }

        .container {
            position: relative;
            width: 400px;
            height: 300px;
            margin: 40px auto;
        }

        .box {
            position: absolute;
            width: 180px;
            height: 180px;
            padding: 20px;
            color: white;
            text-align: center;
        }

        .one {
            background-color: #1e3c72;
            top: 20px;
            left: 20px;
            z-index: 1;
        }

        .two {
            background-color: #d45880;
            top: 80px;
            left: 100px;
            z-index: 2;
        }

        .three {
            background-color: #4c956c;
            top: 140px;
            left: 180px;
            z-index: 3;
        }
    </style>
</head>
<body>

    <h1>CSS Z-Index</h1>

    <div class="container">
        <div class="box one">Layer 1</div>
        <div class="box two">Layer 2</div>
        <div class="box three">Layer 3</div>
    </div>

</body>
</html>
