<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Alignment and Order</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f3;
            padding: 30px;
        }

        .container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 20px;
            height: 300px;
            background: white;
            border: 2px solid #1e3c72;
        }

        .box {
            width: 100px;
            height: 100px;
            background: #1e3c72;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
        }

        .box1 {
            order: 3;
        }

        .box2 {
            order: 1;
        }

        .box3 {
            order: 2;
        }
    </style>
</head>
<body>

    <h1>Flex Alignment and Order</h1>

    <div class="container">
        <div class="box box1">Box 1</div>
        <div class="box box2">Box 2</div>
        <div class="box box3">Box 3</div>
    </div>

</body>
</html>
