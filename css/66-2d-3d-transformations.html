<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D and 3D Transformations</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 30px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .box {
            width: 150px;
            height: 150px;
            background: #1e3c72;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            transition: transform 1s;
        }

        .rotate:hover {
            transform: rotate(45deg);
        }

        .scale:hover {
            transform: scale(1.3);
        }

        .translate:hover {
            transform: translate(30px, 20px);
        }

        .rotate3d:hover {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body>

    <h1>2D and 3D Transformations</h1>

    <div class="container">

        <div class="box rotate">Rotate</div>
        <div class="box scale">Scale</div>
        <div class="box translate">Translate</div>
        <div class="box rotate3d">3D Rotate</div>

    </div>

</body>
</html>
