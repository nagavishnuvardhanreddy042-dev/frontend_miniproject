<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #1e3c72;
            text-shadow: 2px 2px 4px #aaa;
        }

        .card {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            color: #d45880;
            text-shadow: 1px 1px 2px #aaa;
        }
    </style>
</head>
<body>

    <h1>CSS Shadows</h1>

    <div class="card">
        <h2>Shadow Card</h2>
        <p>This card demonstrates box-shadow and text-shadow.</p>
    </div>

</body>
</html>
