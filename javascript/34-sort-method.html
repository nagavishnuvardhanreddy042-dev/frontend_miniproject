<!DOCTYPE html>
<html>
<head>
    <title>Sort Method</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<header>
    <h1>34. Sort Method</h1>
</header>

<main class="container">
    <div class="card">
        <h2>Sort Numbers</h2>
        <p id="output"></p>
    </div>
</main>

<script>
    let numbers = [50, 10, 40, 20, 30];

    numbers.sort(function(a, b) {
        return a - b;
    });

    document.getElementById("output").innerHTML =
        "Sorted Numbers: " + numbers.join(", ");
</script>

</body>
</html>
