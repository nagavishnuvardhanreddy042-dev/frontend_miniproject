<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Methods</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<header>
    <h1>String Methods</h1>
    <p>Working with strings in JavaScript</p>
</header>

<main class="container">
    <div class="card">
        <h2>String Methods Example</h2>
        <p id="output"></p>

        <script>
            let text = "JavaScript Programming";

            document.getElementById("output").innerHTML =
                "Original Text: " + text + "<br>" +
                "Uppercase: " + text.toUpperCase() + "<br>" +
                "Lowercase: " + text.toLowerCase() + "<br>" +
                "Length: " + text.length + "<br>" +
                "Includes JavaScript: " + text.includes("JavaScript");
        </script>

        <br>
        <a href="index.html" class="btn">Back to JavaScript Programs</a>
    </div>
</main>

<footer>
    <p>JavaScript Practical Experiments</p>
</footer>

</body>
</html>
