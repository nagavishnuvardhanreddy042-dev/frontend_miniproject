<!DOCTYPE html>
<html>
<head>
    <title>SetInterval</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<header>
    <h1>47. setInterval()</h1>
</header>

<main class="container">
    <div class="card">
        <h2>Counter</h2>
        <p id="output">0</p>
    </div>
</main>

<script>
    let count = 0;

    let timer = setInterval(function() {
        count++;

        document.getElementById("output").innerHTML =
            "Counter: " + count;

        if (count === 10) {
            clearInterval(timer);
        }
    }, 1000);
</script>

</body>
</html>
