<!DOCTYPE html>
<html>
<head>
    <title>Strict Equality</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<header>
    <h1>42. Strict Equality</h1>
</header>

<main class="container">
    <div class="card">
        <h2>Compare Values and Types</h2>
        <p id="output"></p>
    </div>
</main>

<script>
    let a = 10;
    let b = "10";

    document.getElementById("output").innerHTML =
        "Using == : " + (a == b) +
        "<br>Using === : " + (a === b);
</script>

</body>
</html>
