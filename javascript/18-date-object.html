<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Object</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<header>
    <h1>JavaScript Date Object</h1>
    <p>Displaying current date and time</p>
</header>

<main class="container">
    <div class="card">
        <h2>Date Example</h2>
        <p id="output"></p>

        <script>
            let currentDate = new Date();

            document.getElementById("output").innerHTML =
                "Current Date and Time:<br>" + currentDate;
        </script>

        <br>
        <a href="index.html" class="btn">Back to JavaScript Programs</a>
    </div>
</main>

<footer>
    <p>JavaScript Practical Experiments</p>
</footer>

</body>
</html>
