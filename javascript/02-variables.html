<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Variables</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<header>
    <h1>JavaScript Variables</h1>
    <p>Using var, let and const</p>
</header>

<main class="container">
    <div class="card">
        <h2>Variables Example</h2>
        <p id="output"></p>

        <script>
            let studentName = "N.vishnu Vardhan";
            let age = 20;
            const college = "Sai University";

            document.getElementById("output").innerHTML =
                "Name: " + studentName + "<br>" +
                "Age: " + age + "<br>" +
                "College: " + college;
        </script>

        <br>
        <a href="index.html" class="btn">Back to JavaScript Programs</a>
    </div>
</main>

<footer>
    <p>JavaScript Practical Experiments</p>
</footer>

</body>
</html>
