<!DOCTYPE html>
<html>
<head>
    <title>Type Conversion</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<header>
    <h1>23. Type Conversion</h1>
</header>

<main class="container">
    <div class="card">
        <h2>String to Number</h2>
        <p id="output"></p>
    </div>
</main>

<script>
    let textNumber = "100";

    let convertedNumber = Number(textNumber);

    document.getElementById("output").innerHTML =
        "Original value: " + textNumber +
        "<br>Original type: " + typeof textNumber +
        "<br>Converted value: " + convertedNumber +
        "<br>Converted type: " + typeof convertedNumber;
</script>

</body>
</html>
