<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove Element</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<header>
    <h1>Remove an Element</h1>
    <p>DOM Manipulation Experiment 5</p>
</header>

<main class="container">
    <div class="card">
        <p id="message">This paragraph will be removed.</p>

        <button class="btn" onclick="removeElementDemo()">
            Remove Element
        </button>
    </div>
</main>

<script>
    function removeElementDemo() {
        let element = document.getElementById("message");
        element.remove();
    }
</script>

</body>
</html>
