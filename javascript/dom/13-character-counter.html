<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<header>
    <h1>Character Counter</h1>
    <p>DOM Manipulation Experiment 13</p>
</header>

<main class="container">
    <div class="card">
        <textarea id="text" rows="5" placeholder="Type something..."
                  oninput="countCharacters()"></textarea>

        <p>Characters: <span id="count">0</span></p>
    </div>
</main>

<script>
    function countCharacters() {
        let text = document.getElementById("text").value;

        document.getElementById("count").innerText = text.length;
    }
</script>

</body>
</html>
