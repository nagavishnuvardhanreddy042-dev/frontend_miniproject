<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<header>
    <h1>Image Slider</h1>
    <p>DOM Manipulation Experiment 9</p>
</header>

<main class="container">
    <div class="card">
        <img id="sliderImage"
             src="https://via.placeholder.com/300x180?text=Image+1"
             width="300"
             alt="Slider Image">

        <br><br>

        <button class="btn" onclick="nextImage()">Next Image</button>
    </div>
</main>

<script>
    let images = [
        "https://via.placeholder.com/300x180?text=Image+1",
        "https://via.placeholder.com/300x180?text=Image+2",
        "https://via.placeholder.com/300x180?text=Image+3"
    ];

    let index = 0;

    function nextImage() {
        index = (index + 1) % images.length;

        document.getElementById("sliderImage").src = images[index];
    }
</script>

</body>
</html>
