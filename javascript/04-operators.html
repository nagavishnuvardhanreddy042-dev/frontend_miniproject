<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Operators</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<header>
    <h1>JavaScript Operators</h1>
    <p>Arithmetic and comparison operators</p>
</header>

<main class="container">
    <div class="card">
        <h2>Operators Example</h2>
        <p id="output"></p>

        <script>
            let a = 20;
            let b = 6;

            document.getElementById("output").innerHTML =
                "a + b = " + (a + b) + "<br>" +
                "a - b = " + (a - b) + "<br>" +
                "a * b = " + (a * b) + "<br>" +
                "a / b = " + (a / b).toFixed(2) + "<br>" +
                "a % b = " + (a % b) + "<br>" +
                "a > b = " + (a > b) + "<br>" +
                "a == b = " + (a == b);
        </script>

        <br>
        <a href="index.html" class="btn">Back to JavaScript Programs</a>
    </div>
</main>

<footer>
    <p>JavaScript Practical Experiments</p>
</footer>

</body>
</html>
