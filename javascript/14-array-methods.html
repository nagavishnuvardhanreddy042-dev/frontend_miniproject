<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Methods</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<header>
    <h1>Array Methods</h1>
    <p>Using push, pop, shift and unshift</p>
</header>

<main class="container">
    <div class="card">
        <h2>Array Methods Example</h2>
        <p id="output"></p>

        <script>
            let fruits = ["Apple", "Banana", "Mango"];

            fruits.push("Orange");
            fruits.unshift("Grapes");

            document.getElementById("output").innerHTML =
                "Updated Fruits: " + fruits.join(", ") + "<br>" +
                "Number of Fruits: " + fruits.length;
        </script>

        <br>
        <a href="index.html" class="btn">Back to JavaScript Programs</a>
    </div>
</main>

<footer>
    <p>JavaScript Practical Experiments</p>
</footer>

</body>
</html>
