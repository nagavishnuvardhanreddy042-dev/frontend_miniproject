<!DOCTYPE html>
<html>
<head>
    <title>Reverse Method</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<header>
    <h1>35. Reverse Method</h1>
</header>

<main class="container">
    <div class="card">
        <h2>Reverse an Array</h2>
        <p id="output"></p>
    </div>
</main>

<script>
    let subjects = ["HTML", "CSS", "JavaScript", "Java"];

    subjects.reverse();

    document.getElementById("output").innerHTML =
        "Reversed Array: " + subjects.join(", ");
</script>

</body>
</html>
