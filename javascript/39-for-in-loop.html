<!DOCTYPE html>
<html>
<head>
    <title>For In Loop</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<header>
    <h1>39. For...in Loop</h1>
</header>

<main class="container">
    <div class="card">
        <h2>Display Object Properties</h2>
        <p id="output"></p>
    </div>
</main>

<script>
    let student = {
        name: "N.vishnu Vardhan",
        course: "CSE",
        year: 2
    };

    let result = "";

    for (let key in student) {
        result += key + ": " + student[key] + "<br>";
    }

    document.getElementById("output").innerHTML = result;
</script>

</body>
</html>
