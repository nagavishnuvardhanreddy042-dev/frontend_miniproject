<!DOCTYPE html>
<html>
<head>
    <title>SetTimeout</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<header>
    <h1>46. setTimeout()</h1>
</header>

<main class="container">
    <div class="card">
        <h2>Delayed Message</h2>
        <p id="output">Please wait for 3 seconds...</p>
    </div>
</main>

<script>
    setTimeout(function() {
        document.getElementById("output").innerHTML =
            "This message appeared after 3 seconds.";
    }, 3000);
</script>

</body>
</html>
