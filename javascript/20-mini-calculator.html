<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Calculator</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<header>
    <h1>Mini Calculator</h1>
    <p>Simple calculator using JavaScript</p>
</header>

<main class="container">
    <div class="card">
        <h2>Calculator</h2>

        <input type="number" id="num1" placeholder="Enter first number">
        <br><br>

        <input type="number" id="num2" placeholder="Enter second number">
        <br><br>

        <button class="btn" onclick="calculate('+')">Add</button>
        <button class="btn" onclick="calculate('-')">Subtract</button>
        <button class="btn" onclick="calculate('*')">Multiply</button>
        <button class="btn" onclick="calculate('/')">Divide</button>

        <p id="output"></p>

        <script>
            function calculate(operator) {
                let num1 = Number(document.getElementById("num1").value);
                let num2 = Number(document.getElementById("num2").value);
                let result;

                if (operator === "+") {
                    result = num1 + num2;
                } else if (operator === "-") {
                    result = num1 - num2;
                } else if (operator === "*") {
                    result = num1 * num2;
                } else if (operator === "/") {
                    if (num2 === 0) {
                        result = "Cannot divide by zero";
                    } else {
                        result = num1 / num2;
                    }
                }

                document.getElementById("output").innerHTML =
                    "Result: " + result;
            }
        </script>

        <br>
        <a href="index.html" class="btn">Back to JavaScript Programs</a>
    </div>
</main>

<footer>
    <p>JavaScript Practical Experiments</p>
</footer>

</body>
</html>
