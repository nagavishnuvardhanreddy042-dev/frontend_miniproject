<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>

    <link rel="stylesheet" href="../../assets/style.css">

    <style>
        .notes-box {
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            background-color: #f4f8f9;
            border-radius: 12px;
            box-shadow: 0 0 10px #aaa;
        }

        textarea {
            width: 95%;
            height: 120px;
            padding: 12px;
            font-size: 16px;
        }

        button {
            padding: 10px 18px;
            margin: 10px 5px;
            background-color: #1d5963;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .note {
            background-color: white;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Notes App</h1>
        <p>JavaScript Mini Project</p>
    </header>

    <main class="container">

        <div class="notes-box">
            <h2>Write Your Note</h2>

            <textarea id="noteInput"
                      placeholder="Enter your note"></textarea>

            <br>

            <button onclick="saveNote()">Save Note</button>
            <button onclick="clearNotes()">Clear All</button>

            <h2>Saved Notes</h2>

            <div id="notesList"></div>
        </div>

        <br>

        <a href="../../index.html" class="btn">Back to Home</a>
        <a href="index.html" class="btn">Back to Mini Projects</a>

    </main>

    <footer>
        <p>JavaScript Practical Experiments</p>
    </footer>

    <script>
        function displayNotes() {
            let notes = JSON.parse(localStorage.getItem("notes")) || [];
            let notesList = document.getElementById("notesList");

            notesList.innerHTML = "";

            notes.forEach(function (note) {
                let div = document.createElement("div");
                div.className = "note";
                div.textContent = note;

                notesList.appendChild(div);
            });
        }

        function saveNote() {
            let noteInput = document.getElementById("noteInput");
            let note = noteInput.value.trim();

            if (note === "") {
                alert("Please write a note");
                return;
            }

            let notes = JSON.parse(localStorage.getItem("notes")) || [];

            notes.push(note);

            localStorage.setItem("notes", JSON.stringify(notes));

            noteInput.value = "";

            displayNotes();
        }

        function clearNotes() {
            localStorage.removeItem("notes");
            displayNotes();
        }

        displayNotes();
    </script>

</body>
</html>
