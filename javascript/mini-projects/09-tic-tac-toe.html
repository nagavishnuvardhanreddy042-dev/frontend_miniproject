<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>

    <link rel="stylesheet" href="../../assets/style.css">

    <style>
        .game-box {
            max-width: 400px;
            margin: 30px auto;
            padding: 25px;
            text-align: center;
            background-color: #f4f8f9;
            border-radius: 12px;
            box-shadow: 0 0 10px #aaa;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin: 20px auto;
            width: 300px;
        }

        .cell {
            width: 95px;
            height: 95px;
            font-size: 35px;
            background-color: white;
            border: 2px solid #1d5963;
            cursor: pointer;
        }

        .cell:hover {
            background-color: #dcecef;
        }

        button.reset {
            padding: 12px 20px;
            background-color: #1d5963;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #status {
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>Tic-Tac-Toe</h1>
        <p>JavaScript Mini Project</p>
    </header>

    <main class="container">

        <div class="game-box">
            <h2>Tic-Tac-Toe Game</h2>

            <div class="board" id="board"></div>

            <p id="status">Player X's turn</p>

            <button class="reset" onclick="resetGame()">
                Reset Game
            </button>
        </div>

        <br>

        <a href="../../index.html" class="btn">Back to Home</a>
        <a href="index.html" class="btn">Back to Mini Projects</a>

    </main>

    <footer>
        <p>JavaScript Practical Experiments</p>
    </footer>

    <script>
        let board = ["", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let gameOver = false;

        let winningPatterns = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function createBoard() {
            let boardElement = document.getElementById("board");
            boardElement.innerHTML = "";

            board.forEach(function (value, index) {
                let cell = document.createElement("button");
                cell.className = "cell";
                cell.textContent = value;

                cell.onclick = function () {
                    makeMove(index);
                };

                boardElement.appendChild(cell);
            });
        }

        function makeMove(index) {
            if (board[index] !== "" || gameOver) {
                return;
            }

            board[index] = currentPlayer;
            createBoard();

            if (checkWinner()) {
                document.getElementById("status").textContent =
                    `Player ${currentPlayer} wins!`;

                gameOver = true;
                return;
            }

            if (!board.includes("")) {
                document.getElementById("status").textContent =
                    "It's a draw!";

                gameOver = true;
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";

            document.getElementById("status").textContent =
                `Player ${currentPlayer}'s turn`;
        }

        function checkWinner() {
            return winningPatterns.some(function (pattern) {
                let [a, b, c] = pattern;

                return board[a] &&
                       board[a] === board[b] &&
                       board[a] === board[c];
            });
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            gameOver = false;

            document.getElementById("status").textContent =
                "Player X's turn";

            createBoard();
        }

        createBoard();
    </script>

</body>
</html>
