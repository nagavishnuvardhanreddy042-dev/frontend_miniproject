<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>

    <link rel="stylesheet" href="../../assets/style.css">

    <style>
        .cart-box {
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            background-color: #f4f8f9;
            border-radius: 12px;
            box-shadow: 0 0 10px #aaa;
        }

        .product {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: white;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
        }

        button {
            padding: 8px 15px;
            background-color: #1d5963;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #d45880;
        }

        li {
            margin: 10px 0;
            list-style: none;
            background-color: white;
            padding: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Shopping Cart</h1>
        <p>JavaScript Mini Project</p>
    </header>

    <main class="container">

        <div class="cart-box">
            <h2>Products</h2>

            <div class="product">
                <span>Notebook - ₹50</span>
                <button onclick="addToCart('Notebook', 50)">
                    Add
                </button>
            </div>

            <div class="product">
                <span>Pen - ₹20</span>
                <button onclick="addToCart('Pen', 20)">
                    Add
                </button>
            </div>

            <div class="product">
                <span>Bag - ₹500</span>
                <button onclick="addToCart('Bag', 500)">
                    Add
                </button>
            </div>

            <h2>Cart Items</h2>

            <ul id="cartList"></ul>

            <h3>Total: ₹<span id="total">0</span></h3>
        </div>

        <br>

        <a href="../../index.html" class="btn">Back to Home</a>
        <a href="index.html" class="btn">Back to Mini Projects</a>

    </main>

    <footer>
        <p>JavaScript Practical Experiments</p>
    </footer>

    <script>
        let total = 0;

        function addToCart(productName, price) {
            let li = document.createElement("li");

            li.textContent = `${productName} - ₹${price}`;

            document.getElementById("cartList").appendChild(li);

            total += price;

            document.getElementById("total").textContent = total;
        }
    </script>

</body>
</html>
