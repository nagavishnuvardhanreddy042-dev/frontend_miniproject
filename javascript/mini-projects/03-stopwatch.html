<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>

    <link rel="stylesheet" href="../../assets/style.css">

    <style>
        .stopwatch-box {
            max-width: 450px;
            margin: 30px auto;
            padding: 30px;
            text-align: center;
            background-color: #f4f8f9;
            border-radius: 12px;
            box-shadow: 0 0 10px #aaa;
        }

        #display {
            font-size: 40px;
            font-weight: bold;
            margin: 25px 0;
            color: #1d5963;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #1d5963;
            color: white;
            font-size: 16px;
        }

        button:hover {
            background-color: #d45880;
        }
    </style>
</head>

<body>

    <header>
        <h1>Stopwatch</h1>
        <p>JavaScript Mini Project</p>
    </header>

    <main class="container">

        <div class="stopwatch-box">
            <h2>Stopwatch</h2>

            <div id="display">00:00:00</div>

            <button onclick="startStopwatch()">Start</button>
            <button onclick="pauseStopwatch()">Pause</button>
            <button onclick="resetStopwatch()">Reset</button>
        </div>

        <br>

        <a href="../../index.html" class="btn">Back to Home</a>
        <a href="index.html" class="btn">Back to Mini Projects</a>

    </main>

    <footer>
        <p>JavaScript Practical Experiments</p>
    </footer>

    <script>
        let seconds = 0;
        let minutes = 0;
        let hours = 0;
        let timer = null;

        function updateDisplay() {
            let h = String(hours).padStart(2, "0");
            let m = String(minutes).padStart(2, "0");
            let s = String(seconds).padStart(2, "0");

            document.getElementById("display").textContent =
                `${h}:${m}:${s}`;
        }

        function startStopwatch() {
            if (timer !== null) {
                return;
            }

            timer = setInterval(function () {
                seconds++;

                if (seconds === 60) {
                    seconds = 0;
                    minutes++;
                }

                if (minutes === 60) {
                    minutes = 0;
                    hours++;
                }

                updateDisplay();
            }, 1000);
        }

        function pauseStopwatch() {
            clearInterval(timer);
            timer = null;
        }

        function resetStopwatch() {
            clearInterval(timer);
            timer = null;

            seconds = 0;
            minutes = 0;
            hours = 0;

            updateDisplay();
        }
    </script>

</body>
</html>
