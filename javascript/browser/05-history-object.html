<!DOCTYPE html>
<html>
<head>
    <title>History Object</title>
</head>
<body>

<h1>Browser History Object</h1>

<button onclick="goBack()">Go Back</button>
<button onclick="goForward()">Go Forward</button>

<p>These buttons control browser history.</p>

<script>
    function goBack() {
        history.back();
    }

    function goForward() {
        history.forward();
    }
</script>

</body>
</html>
