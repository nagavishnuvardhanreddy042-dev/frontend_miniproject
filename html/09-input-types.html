<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Input Types</title>

    <link rel="stylesheet" href="../assets/style.css">

    <style>
        form {
            max-width: 600px;
            margin: auto;
            text-align: left;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #1e3c72;
            color: white;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <header>
        <h1>HTML5 Input Types</h1>
        <p>Experiment 9: Different HTML5 Form Inputs</p>
    </header>

    <main class="container">

        <div class="card">
            <form>

                <label for="email">Email Input</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter email"
                >

                <label for="date">Date Input</label>
                <input
                    type="date"
                    id="date"
                >

                <label for="number">Number Input</label>
                <input
                    type="number"
                    id="number"
                    min="1"
                    max="100"
                    placeholder="Enter number"
                >

                <label for="password">Password Input</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                >

                <label for="color">Color Input</label>
                <input
                    type="color"
                    id="color"
                >

                <label for="range">Range Input</label>
                <input
                    type="range"
                    id="range"
                    min="0"
                    max="100"
                >

                <label for="month">Month Input</label>
                <input
                    type="month"
                    id="month"
                >

                <label for="time">Time Input</label>
                <input
                    type="time"
                    id="time"
                >

                <button type="submit">Submit</button>

            </form>

            <br>

            <a href="index.html" class="btn">Back</a>
        </div>

    </main>

    <footer>
        <p>HTML Experiment 9</p>
    </footer>

</body>
</html>
