<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Components</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body>

    <div class="container mt-4">

        <div class="p-4 mb-4 bg-primary text-white rounded">
            <h1>Bootstrap Components</h1>
            <p>Experiment 14: Bootstrap Buttons, Cards and Alerts</p>
        </div>

        <div class="alert alert-success" role="alert">
            Welcome to the Bootstrap demonstration page!
        </div>

        <h2 class="mb-3">Bootstrap Buttons</h2>

        <button class="btn btn-primary">Primary</button>
        <button class="btn btn-success">Success</button>
        <button class="btn btn-danger">Danger</button>
        <button class="btn btn-warning">Warning</button>

        <br><br>

        <h2 class="mb-3">Bootstrap Card</h2>

        <div class="card" style="width: 22rem;">
            <div class="card-body">
                <h5 class="card-title">Computer Science</h5>

                <p class="card-text">
                    Computer Science includes programming,
                    algorithms, databases and web development.
                </p>

                <a href="#" class="btn btn-primary">
                    Learn More
                </a>
            </div>
        </div>

        <br>

        <a href="index.html" class="btn btn-dark">
            Back to HTML Programs
        </a>

    </div>

</body>
</html>
