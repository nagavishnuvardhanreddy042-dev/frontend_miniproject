<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images and Hyperlinks</title>

    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>

    <header>
        <h1>Images and Hyperlinks</h1>
        <p>Experiment 4: Adding Images and Links</p>
    </header>

    <main class="container">

        <div class="card">
            <h2>Image Example</h2>

            <img
                src="https://images.unsplash.com/photo-1506744038136-46273834b3fb"
                alt="Nature Image"
                width="400"
                style="max-width: 100%; border-radius: 12px;"
            >

            <h2>External Hyperlink</h2>

            <p>
                Visit Google by clicking the link below.
            </p>

            <a
                href="https://www.google.com"
                target="_blank"
                class="btn"
            >
                Visit Google
            </a>

            <br><br>

            <a href="index.html" class="btn">Back</a>
        </div>

    </main>

    <footer>
        <p>HTML Experiment 4</p>
    </footer>

</body>
</html>
